# Co poniedzialek rano odswieza oceny obiektu w assets/data/ratings.js.
# Jesli ktoras liczba sie zmieni, workflow wrzuca commit na main,
# a Vercel sam publikuje nowa wersje strony.
name: Oceny obiektu

on:
  schedule:
    - cron: '17 4 * * 1'      # poniedzialek, 04:17 UTC
  workflow_dispatch:           # mozna tez uruchomic recznie z zakladki Actions

permissions:
  contents: write

jobs:
  odswiez:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Odczytaj oceny
        run: python tools/aktualizuj-oceny.py

      - name: Zapisz zmiany
        run: |
          if [ -n "$(git status --porcelain assets/data/ratings.js)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/ratings.js
            git commit -m "Oceny obiektu: odswiezone liczby"
            git push
          else
            echo "Oceny bez zmian — nic do wyslania."
          fi
